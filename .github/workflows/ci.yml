name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit & integration tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  preview:
    name: preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build -w apps/web

      - name: Upload API Worker version
        id: api
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Upload web Worker version
        id: web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URLs
        uses: actions/github-script@v9
        env:
          API_OUTPUT: ${{ steps.api.outputs.command-output }}
          API_STDERR: ${{ steps.api.outputs.command-stderr }}
          WEB_OUTPUT: ${{ steps.web.outputs.command-output }}
          WEB_STDERR: ${{ steps.web.outputs.command-stderr }}
        with:
          script: |
            const marker = '<!-- numbat-preview -->';
            const urlOf = (...parts) => {
              const text = parts.join('\n');
              const m = text.match(/Version Preview Alias URL:\s*(\S+)/);
              return m ? m[1] : null;
            };
            const web = urlOf(process.env.WEB_OUTPUT, process.env.WEB_STDERR);
            const api = urlOf(process.env.API_OUTPUT, process.env.API_STDERR);
            const body = [
              marker,
              '### Preview URLs',
              '',
              web ? `- **Web (SPA):** ${web}` : '- Web: _(not available)_',
              api ? `- **API:** ${api}` : '- API: _(not available)_',
              '',
              '_The web preview serves `/api/*` from its own origin, so the API status may show offline. Updated for this PR._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    name: deploy ${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [worker, web]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        if: matrix.app == 'web'
        run: npm run build -w apps/web

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy

  smoke:
    name: post-deploy smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live endpoints
        run: |
          set -e
          for i in $(seq 1 6); do
            if curl -fsS https://foonix.net/api/health >/dev/null && curl -fsS https://foonix.net/ >/dev/null; then
              echo "smoke OK"; exit 0
            fi
            echo "attempt $i failed; retrying in 10s"; sleep 10
          done
          echo "smoke failed"; exit 1
