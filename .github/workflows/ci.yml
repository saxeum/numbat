name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Fail on high/critical advisories in the production tree. Moderate
      # advisories from dev tools wired in as optional peers (better-auth ->
      # drizzle-kit -> esbuild) are not bundled and don't gate. See KAN-17.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: OpenAPI spec lint
        run: npm run api:lint

      - name: OpenAPI codegen drift
        run: npm run api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit & integration tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Apply D1 migrations (local dev DB)
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply numbat-db --local

      # Test-only auth env for the E2E `wrangler dev` (enables dev sign-in).
      - name: Write test auth env for E2E
        run: |
          cat > apps/worker/.dev.vars <<'EOF'
          ENVIRONMENT=development
          BETTER_AUTH_URL=http://localhost:5173
          BETTER_AUTH_SECRET=test-secret-test-secret-test-secret
          GOOGLE_CLIENT_ID=test-client-id
          GOOGLE_CLIENT_SECRET=test-client-secret
          BYOK_KEK=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BYOK_KEK_VERSION=1
          EOF

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  preview:
    name: preview
    # Fork PRs never receive repository secrets. Dependabot PRs are treated the
    # same way: GitHub withholds secrets from runs triggered by dependabot[bot],
    # so a preview deploy cannot authenticate and would fail for lack of a
    # token. Skip the job rather than report a red check for a credential the
    # contributor cannot supply.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build -w apps/web

      - name: Upload API Worker version
        id: api
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          # Preview versions use the `preview` env (own Worker + its own D1 DB),
          # never production. See docs/persistence-plan.md §4.
          command: versions upload --env preview --preview-alias pr-${{ github.event.number }}

      - name: Upload web Worker version
        id: web
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # Preview SPA uses the `preview` env, whose service binding points at the
          # API preview (isolated DB) — see KAN-14.
          command: versions upload --env preview --preview-alias pr-${{ github.event.number }}

      - name: Comment preview URLs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          API_OUTPUT: ${{ steps.api.outputs.command-output }}
          API_STDERR: ${{ steps.api.outputs.command-stderr }}
          WEB_OUTPUT: ${{ steps.web.outputs.command-output }}
          WEB_STDERR: ${{ steps.web.outputs.command-stderr }}
        with:
          script: |
            const marker = '<!-- numbat-preview -->';
            const urlOf = (...parts) => {
              const text = parts.join('\n');
              const m = text.match(/Version Preview Alias URL:\s*(\S+)/);
              return m ? m[1] : null;
            };
            const web = urlOf(process.env.WEB_OUTPUT, process.env.WEB_STDERR);
            const api = urlOf(process.env.API_OUTPUT, process.env.API_STDERR);
            const body = [
              marker,
              '### Preview URLs',
              '',
              web ? `- **Web (SPA):** ${web}` : '- Web: _(not available)_',
              api ? `- **API:** ${api}` : '- API: _(not available)_',
              '',
              '_The web preview serves `/api/*` from its own origin, so the API status may show offline. Updated for this PR._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    name: deploy ${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        if: matrix.app == 'web'
        run: npm run build -w apps/web

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy

      - name: Deploy API to staging
        if: matrix.app == 'worker'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --env staging

  smoke:
    name: post-deploy smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live endpoints
        run: |
          set -e
          for i in $(seq 1 6); do
            if curl -fsS https://foonix.net/api/health >/dev/null && curl -fsS https://foonix.net/ >/dev/null; then
              echo "smoke OK"; exit 0
            fi
            echo "attempt $i failed; retrying in 10s"; sleep 10
          done
          echo "smoke failed"; exit 1
