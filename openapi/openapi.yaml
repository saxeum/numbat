openapi: 3.1.0
info:
  title: Numbat API
  version: 0.0.0
  description: |
    Public REST API for numbat, served at `/api` on `foonix.net`.

    This document is the **source of truth**: server validators, TypeScript
    types, the fetch client, and the served OpenAPI document are all generated
    from it (see `docs/openapi-plan.md`).
servers:
  - url: https://foonix.net/api
    description: Production
# Everything requires a session except endpoints that opt out (e.g. /health).
# Auth routes live under /api/auth/* (Better Auth) and are not part of this spec.
security:
  - sessionCookie: []
tags:
  - name: system
    description: Service metadata
  - name: gateway
    description: BYOK provider credentials and routing
  - name: chat
    description: Persisted chat conversations and messages
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Service health
      description: Liveness/readiness, including a database probe.
      security: [] # public
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /credentials:
    get:
      operationId: listCredentials
      tags: [gateway]
      summary: List the caller's provider credentials (masked)
      description: Returns metadata only — never the key or its ciphertext.
      responses:
        "200":
          description: The caller's credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCredential
      tags: [gateway]
      summary: Add or replace a provider credential
      description: |
        Verifies the key against the provider before storing it. The key is
        sealed with envelope encryption; only ciphertext is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialRequest"
      responses:
        "201":
          description: Stored (encrypted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    delete:
      operationId: deleteCredential
      tags: [gateway]
      summary: Delete (crypto-shred) a credential
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /models:
    get:
      operationId: listModels
      tags: [gateway]
      summary: List the free-tier model catalog
      description: Static POC catalog seeded in D1 (Gemini + Groq).
      security:
        - sessionCookie: []
        - bearerApiKey: []
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /chat/completions:
    post:
      operationId: chatCompletions
      tags: [gateway]
      summary: OpenAI-compatible chat completion (proxied)
      description: |
        Proxies to the resolved provider using the caller's stored, encrypted
        credential. Supports `gemini`, `groq`, and `nvidia`. Pass `stream: true` for
        Server-Sent Events. The response carries `x-byokfree-provider` and
        `x-byokfree-model` headers.
      security:
        - sessionCookie: []
        - bearerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                stream:
                  type: boolean
                provider:
                  type: string
                  enum: [gemini, groq, nvidia, openrouter]
            examples:
              groq:
                summary: Groq completion (requires a Groq credential)
                value:
                  model: openai/gpt-oss-20b
                  messages:
                    - role: user
                      content: hello
                  stream: false
                  provider: groq
              gemini:
                summary: Gemini completion (requires a Gemini credential)
                value:
                  model: gemini-flash-lite-latest
                  messages:
                    - role: user
                      content: hello
                  stream: false
                  provider: gemini
              nvidia:
                summary: NVIDIA completion (requires an NVIDIA credential)
                value:
                  model: meta/llama-3.3-70b-instruct
                  messages:
                    - role: user
                      content: hello
                  stream: false
                  provider: nvidia
      responses:
        "200":
          description: OpenAI-shaped completion (JSON, or SSE when `stream`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Upstream provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /keys:
    get:
      operationId: listApiKeys
      tags: [gateway]
      summary: List the caller's API keys (masked)
      responses:
        "200":
          description: The caller's API keys (no secret material)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createApiKey
      tags: [gateway]
      summary: Create an API key (token returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created; the plaintext token is only returned here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      operationId: revokeApiKey
      tags: [gateway]
      summary: Revoke an API key
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List the caller's conversations
      description: Metadata only (no messages), newest first.
      responses:
        "200":
          description: The caller's conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      tags: [chat]
      summary: Get a conversation with its messages
      responses:
        "200":
          description: The conversation and its messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateConversation
      tags: [chat]
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete a conversation and its messages
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createMessage
      tags: [chat]
      summary: Append a message to a conversation
      description: |
        Persists a user or assistant turn. Assistant turns carry the
        provider/model and performance metadata (TTFT, token usage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /conversations/{id}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    delete:
      operationId: truncateConversationMessages
      tags: [chat]
      summary: Delete a message and everything after it
      description: Used by edit / regenerate to rewind a conversation.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie (first-party, same-origin).
    bearerApiKey:
      type: http
      scheme: bearer
      description: "Gateway API key (`nbk_…`) sent as `Authorization: Bearer`."
  parameters:
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CredentialId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [ok, timestamp, version]
      properties:
        ok:
          type: boolean
        timestamp:
          type: string
          description: ISO-8601 timestamp
        version:
          type: string
        database:
          type: string
          description: Database probe result (`healthy` | `unhealthy`)
    Credential:
      type: object
      required: [id, provider, label, fingerprint, createdAt, updatedAt]
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [gemini, groq, nvidia, openrouter]
        label:
          type: string
        fingerprint:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    CreateCredentialRequest:
      type: object
      required: [provider, apiKey]
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [gemini, groq, nvidia, openrouter]
        label:
          type: string
          maxLength: 64
        apiKey:
          type: string
          minLength: 1
    Model:
      type: object
      required: [id, object, owned_by, x-provider, x-free]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model]
        owned_by:
          type: string
        x-provider:
          type: string
          enum: [gemini, groq, nvidia, openrouter]
        x-context:
          type: integer
        x-free:
          type: boolean
    ApiKey:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
        revokedAt:
          type: [string, "null"]
    CreateApiKeyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ApiKeyCreated:
      type: object
      required: [id, name, prefix, createdAt, token]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
        revokedAt:
          type: [string, "null"]
        token:
          type: string
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Conversation:
      type: object
      required: [id, title, model, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        model:
          type: string
        provider:
          type: [string, "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
    Message:
      type: object
      required: [id, conversationId, role, content, stopped, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        model:
          type: [string, "null"]
        provider:
          type: [string, "null"]
        promptTokens:
          type: [integer, "null"]
        completionTokens:
          type: [integer, "null"]
        reasoningTokens:
          type: [integer, "null"]
        ttftMs:
          type: [integer, "null"]
        totalMs:
          type: [integer, "null"]
        stopped:
          type: boolean
        createdAt:
          type: string
    ConversationDetail:
      type: object
      required: [id, title, model, createdAt, updatedAt, messages]
      properties:
        id:
          type: string
        title:
          type: string
        model:
          type: string
        provider:
          type: [string, "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        model:
          type: string
          maxLength: 200
        provider:
          type: string
          maxLength: 64
    UpdateConversationRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    CreateMessageRequest:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        model:
          type: string
          maxLength: 200
        provider:
          type: string
          maxLength: 64
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        reasoningTokens:
          type: integer
          minimum: 0
        ttftMs:
          type: integer
          minimum: 0
        totalMs:
          type: integer
          minimum: 0
        stopped:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details: {}
